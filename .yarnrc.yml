nodeLinker: node-modules
enableTelemetry: false

packageExtensions:
  '@commitlint/cli@*':
    peerDependencies:
      '@types/node': '*'
      typescript: '*'
    peerDependenciesMeta:
      '@types/node':
        optional: true
      typescript:
        optional: true
  '@commitlint/load@*':
    peerDependencies:
      '@types/node': '*'
      typescript: '*'
    peerDependenciesMeta:
      '@types/node':
        optional: true
      typescript:
        optional: true
