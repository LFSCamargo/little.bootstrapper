enableTelemetry: false

nodeLinker: node-modules

packageExtensions:
  '@commitlint/cli@*':
    peerDependencies:
      '@types/node': '*'
      typescript: '*'
    peerDependenciesMeta:
      '@types/node':
        optional: true
      typescript:
        optional: true
  '@commitlint/load@*':
    peerDependencies:
      '@types/node': '*'
      typescript: '*'
    peerDependenciesMeta:
      '@types/node':
        optional: true
      typescript:
        optional: true

yarnPath: .yarn/releases/yarn-4.19.0.cjs
